version: "2"

sql:
  - engine: "postgresql"
    queries: "internal/tracking/repository/event/queries.sql"
    schema: "migrations"
    gen:
      go:
        package: "event"
        out: "internal/tracking/repository/event/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
  - engine: "postgresql"
    queries: "internal/tracking/repository/session/queries.sql"
    schema: "migrations"
    gen:
      go:
        package: "session"
        out: "internal/tracking/repository/session/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
