version: "2"

sql:
  - engine: "postgresql"
    queries: "internal/project/repository/postgres/element/queries.sql"
    schema: "migrations/schemes"
    gen:
      go:
        package: "element"
        out: "internal/project/repository/postgres/element/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
  - engine: "postgresql"
    queries: "internal/project/repository/postgres/project/queries.sql"
    schema: "migrations/schemes"
    gen:
      go:
        package: "project"
        out: "internal/project/repository/postgres/project/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"